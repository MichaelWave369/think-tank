name: CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: node --test scripts/owned-browser-contract.node.mjs
      - run: node --test scripts/tt44-provenance-policy.node.mjs
      - run: node --check scripts/verify-tt44-main-provenance.mjs
      - run: node --test scripts/tt45-consumer-policy.node.mjs
      - run: node --check scripts/verify-tt45-independent-consumer.mjs
      - run: node --test scripts/tt46-adversarial-attestations.node.mjs
      - run: node --check scripts/tt46-adversarial-attestations.mjs
      - run: node --test scripts/tt47-portable-proof.node.mjs
      - run: node --check scripts/tt47-portable-proof.mjs
      - run: node --check scripts/verify-tt47-portable-proof.mjs
      - run: node --test scripts/tt48-isolation-policy.node.mjs
      - run: node --check scripts/tt48-isolation-policy.mjs
      - run: node --test scripts/tt49-offline-adversarial.node.mjs
      - run: node --check scripts/tt49-offline-adversarial.mjs
      - run: node --check scripts/verify-tt49-offline-adversarial.mjs
      - run: node --test scripts/tt50-signed-subject-binding.node.mjs
      - run: node --check scripts/tt50-signed-subject-binding.mjs
      - run: node --check scripts/verify-tt48-network-isolated.mjs
      - run: node --test scripts/tt51-operator-proof.node.mjs
      - run: node --check scripts/verify-tt51-operator-proof.mjs
      - name: Verify actual network-disabled Docker namespace and mounted GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24-bookworm-slim
          gh_binary="$(command -v gh)"
          test -f "$gh_binary"
          docker run --rm --network none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --mount "type=bind,src=$gh_binary,dst=/usr/local/bin/gh,readonly" \
            --workdir /work --env HOME=/tmp \
            --env XDG_CONFIG_HOME=/tmp --env XDG_CACHE_HOME=/tmp \
            node:24-bookworm-slim \
            node scripts/tt48-docker-preflight.mjs
      - run: npm run bridge:check
      - run: npm run bridge:test
      - run: npm run council:build
      - run: node .generated-local-council/local-council-entry.js inspect tests/fixtures/local-council.sample.json
      - run: node --test scripts/local-council-cli.node.mjs
      - run: npm run build
      - run: npm run pages:build
      - run: npm run pages:check
