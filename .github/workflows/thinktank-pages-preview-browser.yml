name: thinktank-pages-preview-browser

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "scripts/build-pages.mjs"
      - "scripts/check-pages-build.mjs"
      - "scripts/check-pages-preview.mjs"
      - "scripts/check-observatory-live.mjs"
      - "scripts/check-owned-receipt-review.mjs"
      - "scripts/check-operator-proof-guide.mjs"
      - "scripts/owned-browser-contract.mjs"
      - "scripts/owned-browser-contract.node.mjs"
      - "scripts/run-owned-browser-probe.mjs"
      - "tests/fixtures/observatory-owned-counter.html"
      - "tests/fixtures/observatory-owned-counter.contract.json"
      - ".github/workflows/thinktank-pages-preview-browser.yml"

permissions:
  contents: read

jobs:
  public-react-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install React dependencies
        run: npm install --no-audit --no-fund
      - name: Build published React /think-tank/ profile
        run: npm run pages:build
      - name: Verify exact compiled CSS and JavaScript
        run: npm run pages:check
      - name: Install pinned Chromium runner (no model keys)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install real headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise separate owned fixture in real loopback Chromium
        run: node scripts/run-owned-browser-probe.mjs
      - name: Verify preview and import real TT-42 receipt in Chromium
        env:
          TT43_REQUIRE_RECEIPT: "1"
          TT51_REQUIRE_GUIDE: "1"
        run: node scripts/check-pages-preview.mjs
      - name: Upload TT-42 separate owned app machine observations
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tt42-owned-app-dom-probe
          path: artifacts/observatory/tt42-*
          if-no-files-found: error
          retention-days: 14
      - name: Upload scoped first-party Observatory browser receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tt41-owned-observatory-chromium
          path: artifacts/observatory/
          if-no-files-found: error
          retention-days: 14
